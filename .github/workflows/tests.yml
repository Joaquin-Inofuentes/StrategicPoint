# Corre las comprobaciones estaticas (siempre) y la suite del juego (si hay licencia) en cada push y pull request.
# Necesita una licencia de Unity cargada como secretos del repositorio (UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD)
# segun https://game-ci.com/docs/github/activation. Mientras no esten cargados el trabajo avisa y se salta la suite
# (antes fallaba en rojo en cada push con "Missing Unity License File"); con los secretos corre y falla si algo falla.
name: Pruebas
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # No necesita licencia: valida .meta, reglas de codigo, conteos de la auditoria y escenas del build en cada push.
  estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobaciones estaticas
        run: python3 Tools/Ci/verificar_estatico.py
      # El indice para IA (Docs/INDICE_IA) se genera del codigo: si alguien toca un
      # script y no lo regenera, queda mintiendo. Un comando lo arregla, y el paso
      # dice cual.
      - name: Indice para IA al dia
        run: |
          python3 Tools/Indice/indexar_ia.py --check || { python3 Tools/Indice/indexar_ia.py > /dev/null; git diff --ignore-matching-lines='Generado por' -- Docs/INDICE_IA | head -80; exit 1; }

  suite:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Aviso si faltan los secretos de Unity
        if: env.UNITY_LICENSE == ''
        run: |
          echo "::warning::Sin secreto UNITY_LICENSE, la suite NO se ejecuto en GitHub. Cargalo en Settings > Secrets (ver game-ci.com/docs/github/activation)."
      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''
        with:
          lfs: true
      - uses: actions/cache@v4
        if: env.UNITY_LICENSE != ''
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-
      # game-ci ejecuta el metodo y falla el trabajo si Unity sale con codigo distinto de 0
      # (RunAll sale con 0 si toda la suite paso y con 1 si algo fallo).
      - uses: game-ci/unity-builder@v4
        if: env.UNITY_LICENSE != ''
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.6f1
          targetPlatform: StandaloneWindows64
          buildMethod: SP.EditorTools.HeadlessTestRunner.RunAll
